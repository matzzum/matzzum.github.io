<link rel="stylesheet" href="css/map-tab.css">

<div id="map-container">
    <div id="left-panel">
        <div class="drag-handle" onclick="toggleCollapse()"><div class="toggle-btn-text">접기 / 펼치기</div></div>
        <div class="main-title-box">
            <h1 class="app-logo">
                Woody Table
            </h1>
        </div>
        <div id="list-header">
            <input type="text" id="searchInput" placeholder="식당 검색..." oninput="filterDataDebounced()">
            <div class="filter-row">
                <select id="regionFilter" class="filter-item" onchange="filterData()">
                    <option value="all">지역 전체</option>
                </select>
                <div id="sortToggle" class="filter-item" onclick="toggleSort()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3c-3.3 0-6 2.7-6 6 0 4.5 6 12 6 12s6-7.5 6-12c0-3.3-2.7-6-6-6Z"/><circle cx="12" cy="9" r="2.2"/></svg>거리순</div>
                <div id="dinnerToggle" class="filter-item" onclick="toggleDinner()"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a7 7 0 0 0 10.5 10.5Z"/></svg>석식</div>
                <div id="locate-btn" class="filter-item home-inline-btn" onclick="moveToGPS()" title="현재 위치">
                    <svg viewBox="0 0 24 24" fill="none" stroke="var(--primary)" stroke-width="1.6" stroke-linecap="round"><circle cx="12" cy="12" r="3" fill="var(--primary)" stroke="none"/><circle cx="12" cy="12" r="7.5"/><line x1="12" y1="2" x2="12" y2="4.5"/><line x1="12" y1="19.5" x2="12" y2="22"/><line x1="2" y1="12" x2="4.5" y2="12"/><line x1="19.5" y1="12" x2="22" y2="12"/></svg>
                </div>
                <div id="home-btn" class="filter-item home-inline-btn" onclick="goHome()"><svg viewBox="0 0 24 24"><path d="M12 3 L20 11 L4 11 Z" fill="#fff"/><rect x="5" y="10.5" width="14" height="10.5" fill="#fff"/><rect x="15" y="2.2" width="2.2" height="5.3" rx="0.3" fill="#fff"/><rect x="7.6" y="13" width="2.8" height="2.8" rx="0.4" fill="var(--primary)"/><rect x="13.6" y="13" width="2.8" height="2.8" rx="0.4" fill="var(--primary)"/><rect x="7.6" y="17" width="2.8" height="2.8" rx="0.4" fill="var(--primary)"/><rect x="13.6" y="17" width="2.8" height="2.8" rx="0.4" fill="var(--primary)"/></svg></div>
            </div>
        </div>
        <div id="list-scroll"><div id="restaurantCards"></div></div>
    </div>

    <div id="detail-panel">
        <div style="padding: 24px 24px 12px; position: relative; border-bottom: 1px solid var(--border-dark);">
            <div class="plp-popup-close" style="position: absolute; top: 20px; right: 20px; cursor: pointer; color: var(--text-secondary); width:32px; height:32px; display:flex; align-items:center; justify-content:center; border-radius:50%; background:var(--border-dark); font-size:1.2em; transition:all 0.2s;" onclick="closeDetail()">✕</div>
            <div id="detailName" style="font-size: 1.4em; font-weight: 800; color: var(--text-primary); padding-right:36px; line-height:1.3;"></div>
            <div id="detailPopularity" style="font-size: 0.85em; color: var(--text-secondary); margin-top: 6px; font-weight: 700; display: none;">🔥 인기도: <span id="popularityCount">0</span></div>
        </div>
        <div style="padding: 20px 24px 24px; overflow-y: auto; flex: 1;" class="plp-popup-body">
            <div id="detailDesc" style="font-size: 0.95em; color:var(--text-primary); line-height:1.7; margin-bottom:16px; word-break: keep-all;"></div>
            <div style="font-size: 0.9em; color:var(--text-secondary); background: var(--border-dark); padding: 16px; border-radius: 16px; border: 1px solid var(--border-light);">
                <p style="margin-bottom:8px;"><strong>🕒 영업 시간</strong><br><span id="detailHours" style="display:inline-block; margin-top:6px; color:var(--text-primary);"></span></p>
                <p><strong>💰 가격:</strong> <span id="detailPrice" style="color:var(--text-primary); font-weight:800;"></span></p>
            </div>
            <!-- SNS 버튼 영역 -->
            <div id="snsArea" class="plp-popup-sns" style="margin-top:20px;"></div>
            <!-- 정보 수정 제안 섹션: 평소엔 접혀 있다가 펼치면 항목을 한 번에 채워
                 제출. 바로 반영되지 않고 pendingEdits에 쌓여 운영자가 검토 후 반영 -->
            <div class="review-section">
                <div class="review-section-title edit-suggest-header" onclick="toggleEditSuggest()">
                    <span>✏️ 정보 수정 제안</span>
                    <span class="edit-suggest-toggle-btn"><span id="editSuggestLabel">펼치기</span><span id="editSuggestChevron" class="edit-suggest-chevron">▾</span></span>
                </div>
                <div id="editSuggestBody" class="edit-suggest-body" hidden>
                    <div style="font-size:0.78em; color: var(--text-secondary); margin: -2px 0 10px;">바뀐 항목만 적고 한 번에 제출해주세요. 영업 요일은 실제 여는 요일만 체크, 폐업한 곳이면 폐업 제보만 체크해도 돼요.</div>
                    <div class="edit-field-row">
                        <label>가격</label>
                        <input type="text" id="editPrice" placeholder="예: 8000원" maxlength="50">
                    </div>
                    <div class="edit-field-row">
                        <label>영업시간</label>
                        <input type="text" id="editHours" placeholder="예: 11:30~14:00" maxlength="80">
                    </div>
                    <div class="edit-field-row">
                        <label>영업 요일</label>
                        <div class="edit-days-list" id="editDaysList">
                            <div class="edit-day-chip" data-day="월" onclick="onEditDayChipClick(this)">월</div>
                            <div class="edit-day-chip" data-day="화" onclick="onEditDayChipClick(this)">화</div>
                            <div class="edit-day-chip" data-day="수" onclick="onEditDayChipClick(this)">수</div>
                            <div class="edit-day-chip" data-day="목" onclick="onEditDayChipClick(this)">목</div>
                            <div class="edit-day-chip" data-day="금" onclick="onEditDayChipClick(this)">금</div>
                            <div class="edit-day-chip" data-day="토" onclick="onEditDayChipClick(this)">토</div>
                            <div class="edit-day-chip" data-day="일" onclick="onEditDayChipClick(this)">일</div>
                        </div>
                    </div>
                    <div class="edit-field-row">
                        <label>식단표 URL</label>
                        <input type="text" id="editMenuUrl" placeholder="사진/URL 붙여넣기" maxlength="150">
                    </div>
                    <div class="edit-field-row">
                        <label class="checkbox-label"><input type="checkbox" id="editClosedCheck" onchange="onEditClosedToggle()"> 폐업 제보</label>
                        <input type="text" id="editClosedNote" placeholder="(선택) 참고 내용" maxlength="150" disabled>
                    </div>
                    <button class="edit-suggest-submit-btn" onclick="submitEditSuggestion()">제출</button>
                </div>
                <div id="editCooldownMsg"></div>
            </div>
            <!-- 한줄평 섹션 -->
            <div class="review-section">
                <div class="review-section-title">💬 한줄평</div>
                <div class="review-input-row review-input-stacked">
                    <input type="text" id="reviewNickname" placeholder="닉네임" maxlength="10">
                    <div class="review-input-bottom">
                        <input type="text" id="reviewInput" placeholder="한줄평..." maxlength="50">
                        <button onclick="submitReview()">등록</button>
                    </div>
                </div>
                <div id="reviewCooldownMsg"></div>
                <div id="reviewList" class="review-list"></div>
            </div>
        </div>
    </div>

    <div id="map-area">
        <div id="map"></div>
        <div id="gps-permission-banner" class="gps-permission-banner" hidden>
            <span class="gps-permission-icon">📍</span>
            <div class="gps-permission-text">현재 위치를 확인할 수 없어요.<br>브라우저 설정에서 위치 정보 접근을 허용해주세요.</div>
            <div class="gps-permission-actions">
                <button class="gps-permission-retry" onclick="retryLocationPermission()">다시 시도</button>
                <button class="gps-permission-close" onclick="dismissGpsPermissionBanner()">닫기</button>
            </div>
        </div>
        <div id="picker-crosshair">📍</div>
        <div id="location-picker-ui">
            <div style="font-weight:800; font-size:1.1em; margin-bottom:8px; color:var(--primary);" id="picker-title">새 위치 지정</div>
            <div style="font-size:0.85em; color:var(--text-secondary); margin-bottom:16px;">지도를 움직여 중심을 맞춘 후<br>완료를 눌러주세요.</div>
            <div style="display:flex; justify-content:center; gap:10px;">
                <button class="picker-btn picker-btn-cancel" onclick="cancelLocationPicker()">뒤로 가기</button>
                <button class="picker-btn picker-btn-save" onclick="saveLocation()">이 위치로 설정</button>
            </div>
        </div>
    </div>
</div>

<script src="js/map-tab.js"></script>
