<link rel="stylesheet" href="css/game-tab.css">

<div id="game-container">
    <div class="roulette-header">
        <h1 id="mainTitle"><span class="roulette-title-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="10" cy="12" r="7.2"/><circle cx="10" cy="12" r="3.8"/><line x1="17.5" y1="4" x2="17.5" y2="9.5"/><line x1="16" y1="4" x2="16" y2="7"/><line x1="19" y1="4" x2="19" y2="7"/><line x1="17.5" y1="9.5" x2="17.5" y2="16"/></svg></span>점심 룰렛</h1>
        <p id="mainSubtitle">오늘 뭐 먹을지 결정 못 하겠다면?</p>
    </div>

    <!-- 모드 토글 (미니/일반) -->
    <div class="mode-toggle">
        <button class="mode-btn active" id="btnMini" onclick="setGlobalMode('mini')"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M13 2 4 14h6l-1 8 9-12h-6l1-8Z"/></svg>미니</button>
        <button class="mode-btn" id="btnFull" onclick="setGlobalMode('full')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><ellipse cx="12" cy="12" rx="4" ry="9"/><line x1="3" y1="12" x2="21" y2="12"/></svg>일반</button>
    </div>

    <!-- 점심 룰렛 영역: 조각을 탭하면 그 자리에 입력창이 뜸(칸을 별도로 안 씀) -->
    <div class="wheel-area" id="wheelArea">
        <div class="wheel-pointer"></div>
        <canvas id="rouletteCanvas"></canvas>
        <div id="rouletteSlotEditor" class="roulette-slot-editor" hidden>
            <input type="text" id="rouletteSlotEditorInput" placeholder="가게 이름 입력" autocomplete="off"
                   oninput="roulette.onEditorInput()">
            <div id="rouletteSlotEditorDropdown" class="roulette-slot-editor-dropdown"></div>
        </div>
    </div>
    <!-- 자동 배치(왼쪽)와 돌려돌려(오른쪽)를 한 줄에 — 예전엔 자동 배치가 휠
         위에 따로 있어서 그만큼 아래로 밀려 모바일 광고 배너에 가려졌음 -->
    <div class="roulette-actions">
        <button class="auto-arrange-btn" id="autoArrangeBtn" onclick="roulette.autoArrange()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="4.3"/><circle cx="12" cy="12" r="1.1" fill="currentColor" stroke="none"/></svg><span id="autoArrangeBtnLabel">자동 배치</span></button>
        <button class="spin-btn" id="spinBtn" onclick="roulette.spin()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 1 1-2.6-5.9"/><path d="M20 4v5h-5"/></svg>돌려돌려!</button>
    </div>
    <div class="result-card visible" id="resultCard">
        <div class="result-label" id="resultLabel">오늘의 점심은</div>
        <div class="result-name" id="resultName"><span class="emoji-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9.5"/><path d="M9.2 9a2.8 2.8 0 1 1 4.3 2.4c-.8.5-1.5 1-1.5 2.1"/><circle cx="12" cy="17" r="0.9" fill="currentColor" stroke="none"/></svg></span>무엇이 나올까요?</div>
        <div class="result-meta" id="resultMeta">돌려돌려 버튼을 눌러보세요!</div>
        <div class="result-links" id="resultLinks"></div>
    </div>
</div>

<script src="js/game-tab.js"></script>
